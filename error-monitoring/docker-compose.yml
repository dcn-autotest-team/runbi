# runbi 错误监控 — GlitchTip (Sentry 兼容, 轻量, 可私有化)
# 用法: docker compose up -d
# 访问: http://localhost:8000  (首次注册管理员账号)
# 说明: 客户端可用 Sentry SDK, DSN 形如 http://<PUBLIC_KEY>@localhost:8000/<PROJECT_ID>

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
      POSTGRES_DB: glitchtip
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  glitchtip:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      SECRET_KEY: "runbi-dev-change-me-please-2026"
      DATABASE_URL: "postgres://glitchtip:glitchtip@postgres:5432/glitchtip"
      REDIS_URL: "redis://redis:6379/0"
      # 本地开发: 关闭邮件, 首账号直接注册即可
      EMAIL_ENABLED: "false"
      CELERY_ALWAYS_EAGER: "true"
      # 若只用浏览器/桌面端上报, 不需 cors 白名单; 扩展场景可放开
      CORS_ALLOWED_ORIGINS: "*"

volumes:
  pgdata:

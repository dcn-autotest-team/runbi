[package]
name = "runbi-desktop"
version = "1.0.3"
description = "Runbi Desktop - Raycast-like AI Text Polishing Assistant (Tauri 2.x + Rust)"
authors = ["Runbi Core Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.2"
tauri-plugin-clipboard-manager = "2.2"
tauri-plugin-single-instance = "2.2"
tauri-plugin-store = "2.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
# 错误遥测(GlitchTip/Sentry 协议):仅在 RUNBI_GLITCHTIP_DSN 环境变量存在时启用,默认不上报(隐私优先)
sentry = { version = "0.36", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security_Cryptography"
] }
windows = { version = "0.61", features = [
    "Win32_System_Com",
    "Win32_UI_Accessibility"
] }

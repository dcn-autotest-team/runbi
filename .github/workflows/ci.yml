name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run

  rust:
    name: Rust Check & Tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # generate_context!() requires frontendDist to exist at compile time;
      # the real frontend build is covered by the frontend job, so a stub
      # index.html is enough here.
      - run: |
          mkdir -p ../dist
          echo '<!doctype html><html></html>' > ../dist/index.html
      - run: cargo check --all-targets
      - run: cargo test

  audit:
    name: Dependency Audit (high+)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
